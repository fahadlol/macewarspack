name: Build and Publish MaceWars Resource Packon:  push:    branches:      - main  workflow_dispatch:permissions:  contents: writeconcurrency:  group: macewars-resource-pack  cancel-in-progress: truejobs:  build:    runs-on: ubuntu-latest    steps:      - name: Checkout repository        uses: actions/checkout@v4      - name: Build resource pack ZIP        run: |          rm -f macewars.zip          zip -r macewars.zip \            assets \            pack.mcmeta \            pack.png      - name: Verify resource pack        run: |          unzip -l macewars.zip          if ! unzip -l macewars.zip | grep -q "pack.mcmeta"; then            echo "pack.mcmeta is missing from ZIP root"            exit 1          fi      - name: Generate SHA1        run: |          sha1sum macewars.zip | awk '{print $1}' > macewars.sha1          echo "Resource Pack SHA1:"          cat macewars.sha1      - name: Create or update latest release        env:          GH_TOKEN: ${{ github.token }}        run: |          if gh release view latest >/dev/null 2>&1; then            gh release upload latest \              macewars.zip \              macewars.sha1 \              --clobber          else            gh release create latest \              macewars.zip \              macewars.sha1 \              --title "Latest MaceWars Resource Pack" \              --notes "Automatically built from the latest main branch."          fi